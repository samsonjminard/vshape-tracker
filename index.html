<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#060608">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WellnessOS">
<title>WellnessOS</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060608;--bg2:#0d0d12;--bg3:#141419;--bg4:#1c1c24;
  --border:#252530;--border2:#353545;
  --text:#ebebf0;--muted:#55556a;--muted2:#7777a0;
  --red:#ff2d55;--green:#00e5a0;--yellow:#ffd60a;--blue:#0a84ff;--cyan:#40c8e0;--orange:#ff9f0a;
  --mono:'Space Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100%;max-width:480px;margin:0 auto}
body{padding-bottom:80px}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
button{font-family:var(--sans);cursor:pointer;border:none;background:none}
textarea,input,select{font-family:var(--sans)}
::-webkit-scrollbar{width:0}

/* NAV */
nav{
  position:sticky;top:0;z-index:100;
  background:rgba(6,6,8,0.97);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.nav-top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 10px}
.logo{font-family:var(--display);font-size:20px;letter-spacing:3px;color:var(--red)}
.logo em{color:var(--muted2);font-style:normal}
.nav-right{display:flex;gap:8px;align-items:center}
.btn-settings{width:30px;height:30px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--muted2);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tabs{display:flex;border-top:1px solid var(--border)}
.tab{flex:1;padding:10px 4px 12px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted2);border-bottom:2px solid transparent;transition:all .2s;cursor:pointer}
.tab.active{color:var(--text);border-bottom-color:var(--red)}

/* PANELS */
.panel{display:none;padding:18px 16px}
.panel.active{display:block}

/* SECTION HEADER */
.sh{display:flex;align-items:center;gap:10px;margin:20px 0 13px}
.sh-title{font-family:var(--mono);font-size:9px;color:var(--muted2);letter-spacing:2px;text-transform:uppercase;white-space:nowrap}
.sh-line{flex:1;height:1px;background:var(--border)}

/* TOAST */
#toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--bg4);border:1px solid var(--border2);padding:9px 18px;border-radius:100px;font-size:12px;font-weight:700;opacity:0;transition:all .25s;z-index:999;white-space:nowrap;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* DRIVE BAR */
#drive-bar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap}
.sync-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,0.15);flex-shrink:0;transition:all .3s}
.sync-dot.ok{background:#00e5a0;box-shadow:0 0 6px #00e5a0}
.sync-dot.syncing{background:#ffd60a;animation:pulse 1s infinite}
.sync-dot.err{background:#ff2d55}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
#drive-status{flex:1;font-size:10px;font-weight:600;color:var(--muted2);letter-spacing:.3px}
#drive-status.ok{color:#00e5a0}
#drive-status.err{color:#ff2d55}
#drive-status.syncing{color:#ffd60a}
.drive-btn{display:flex;align-items:center;gap:5px;border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer;transition:all .2s;border:1px solid;font-family:var(--sans)}
#btn-drive-login{background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.35);color:#5aadff}
#btn-drive-logout{background:rgba(255,255,255,.04);border-color:var(--border);color:var(--muted2)}

/* BTNS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:700;transition:all .2s;cursor:pointer;letter-spacing:.3px}
.btn-primary{background:var(--red);color:#fff}
.btn-secondary{background:var(--bg3);border:1px solid var(--border2);color:var(--text)}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted2)}
.btn-sm{padding:7px 12px;font-size:11px}
.btn-full{width:100%}
.btn-primary:active{opacity:.85}
.btn-secondary:active{opacity:.8}

/* ═══════════ ENTRENO ═══════════ */
.day-header{margin-bottom:14px}
.day-header-date{font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.day-header-name{font-family:var(--display);font-size:38px;line-height:1;letter-spacing:1px}
.day-header-sub{font-size:12px;color:var(--muted2);margin-top:3px}

.day-selector{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:14px}
.day-btn{border-radius:9px;padding:7px 3px;border:1.5px solid var(--border);background:transparent;cursor:pointer;transition:all .2s}
.day-btn-lbl{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;text-align:center;color:var(--muted2);line-height:1.5}

.prog-wrap{margin-bottom:14px}
.prog-top{display:flex;justify-content:space-between;margin-bottom:5px}
.prog-lbl{font-size:9px;color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.prog-val{font-size:9px;font-weight:700;font-family:var(--mono)}
.prog-track{height:2px;background:rgba(255,255,255,.06);border-radius:100px;overflow:hidden}
.prog-fill{height:100%;border-radius:100px;transition:width .4s ease}

.rest-bar{display:none;align-items:center;gap:10px;background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px 13px;margin-bottom:12px}
.rest-bar.on{display:flex}
.rb-info{flex:1}
.rb-lbl{font-size:8px;color:var(--muted2);font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:2px}
.rb-val{font-size:20px;font-weight:700;font-family:var(--mono)}
.rb-track{height:2px;background:rgba(255,255,255,.06);border-radius:100px;margin-top:4px}
.rb-fill{height:100%;border-radius:100px;transition:width 1s linear}
.btn-skip{background:var(--bg4);border:1px solid var(--border);border-radius:7px;color:var(--muted2);padding:7px 10px;font-size:10px;font-weight:700;cursor:pointer;flex-shrink:0}

.block-wrap{margin-bottom:16px}
.block-hdr{margin-bottom:7px}
.ss-badge{display:inline-flex;align-items:center;border-radius:100px;padding:3px 9px;border:1px solid var(--border);font-size:9px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted2)}
.block-solo-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.block-exs{border-left:2px solid;padding-left:11px}

.ex-card{background:var(--bg2);border:1px solid var(--border);border-radius:11px;padding:12px 12px 9px;margin-bottom:2px}
.ex-card:last-child{margin-bottom:9px}
.ex-name{font-size:14px;font-weight:700;margin-bottom:2px}
.ex-meta{font-size:11px;color:var(--muted2)}
.ex-meta b{font-weight:700}
.col-hdrs{display:grid;grid-template-columns:28px 1fr 13px 1fr 42px;gap:5px;margin:9px 0 2px;align-items:center}
.col-hdr{font-size:8px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.8px;text-transform:uppercase}
.set-row{display:grid;grid-template-columns:28px 1fr 13px 1fr 42px;align-items:center;gap:5px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04);transition:opacity .2s}
.set-row.done{opacity:.38}
.set-num{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:var(--mono);background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted2)}
.set-in{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:7px;color:var(--text);font-size:16px;font-weight:600;text-align:center;padding:8px 3px;outline:none;font-family:var(--mono)}
.set-in:focus{border-color:var(--border2)}
.set-in:disabled{opacity:.35}
.set-sep{color:var(--muted);font-size:12px;text-align:center}
.btn-chk{width:42px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;transition:all .15s;cursor:pointer;flex-shrink:0}

.notes-ta{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;padding:9px 11px;outline:none;resize:none;line-height:1.5}
.notes-ta::placeholder{color:var(--muted)}
.notes-ta:focus{border-color:var(--border2)}

.cardio-card{background:var(--bg2);border:1px solid;border-radius:13px;padding:16px;margin-bottom:14px}
.cardio-icon{font-size:28px;margin-bottom:7px}
.cardio-zone-badge{display:inline-flex;align-items:center;border-radius:100px;padding:3px 11px;border:1px solid;font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:9px}
.cardio-fc{font-size:24px;font-weight:900;font-family:var(--mono);margin-bottom:2px}
.cardio-dur{font-size:11px;color:var(--muted2);margin-bottom:11px}
.cardio-desc{font-size:13px;color:rgba(235,235,240,.72);line-height:1.55;margin-bottom:9px}
.cardio-rule{font-size:11px;font-weight:700;padding:8px 11px;border-radius:7px;background:rgba(255,214,10,.06);border:1px solid rgba(255,214,10,.2);color:rgba(255,214,10,.85);line-height:1.5}
.cardio-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:11px}
.cardio-field{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:10px 11px}
.cf-lbl{font-size:8px;font-weight:700;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:5px}
.cf-in{width:100%;background:transparent;border:none;color:var(--text);font-size:18px;font-weight:700;font-family:var(--mono);outline:none;padding:0}
.cf-in::placeholder{color:rgba(255,255,255,.14)}
.cf-unit{font-size:9px;color:var(--muted);margin-top:2px}
.cardio-ta{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--text);font-size:12px;padding:9px 11px;outline:none;resize:none;line-height:1.5;margin-bottom:11px}
.cardio-ta::placeholder{color:var(--muted)}
.cardio-saved{display:flex;align-items:center;justify-content:center;gap:7px;padding:13px;border-radius:11px;font-size:13px;font-weight:800;border:1px solid;margin-bottom:10px}

/* ═══════════ RECOVERY ═══════════ */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.week-nav-lbl{font-family:var(--mono);font-size:11px;font-weight:700}
.btn-wk{background:var(--bg3);border:1px solid var(--border);border-radius:7px;color:var(--muted2);padding:7px 11px;font-size:13px;cursor:pointer;transition:all .2s}
.btn-wk:hover{color:var(--text)}
.btn-wk:disabled{opacity:.3;cursor:default}

.scores-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:13px}
.score-card{background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:13px 9px;text-align:center}
.sc-lbl{font-family:var(--mono);font-size:8px;color:var(--muted2);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.sc-val{font-family:var(--display);font-size:44px;line-height:1}
.sc-name{font-size:9px;color:var(--muted2);margin-top:2px}
.hi{color:var(--green)}.mid{color:var(--yellow)}.lo{color:var(--red)}.na{color:var(--muted2)}

.decision{border-radius:9px;padding:13px 15px;margin-bottom:14px;border-left:3px solid;background:var(--bg3)}
.dec-tag{font-family:var(--mono);font-size:8px;letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.dec-main{font-size:15px;font-weight:700}
.dec-sub{font-size:12px;color:var(--muted2);margin-top:4px;line-height:1.55}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label{font-family:var(--mono);font-size:8px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase}
.fld input{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 11px;font-family:var(--mono);font-size:16px;color:var(--text);outline:none;transition:border-color .2s}
.fld input:focus{border-color:var(--border2)}

/* ═══════════ PROGRESO ═══════════ */
.data-bar{display:flex;gap:7px;margin-bottom:18px;flex-wrap:wrap}
.chart-card{background:var(--bg2);border:1px solid var(--border);border-radius:13px;padding:15px;margin-bottom:14px}
.chart-ttl{font-family:var(--mono);font-size:9px;color:var(--muted2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:13px}
canvas{display:block;width:100%}
.hist-tbl{width:100%;border-collapse:collapse}
.hist-tbl th{font-family:var(--mono);font-size:8px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;padding:0 0 9px;text-align:left;font-weight:400}
.hist-tbl td{padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.hist-tbl tr:last-child td{border-bottom:none}
.mono-sm{font-family:var(--mono);font-size:11px}
.btn-del{background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:2px 5px;border-radius:5px}
.btn-del:hover{background:rgba(255,45,85,.1);color:var(--red)}

/* ═══════════ COACH ═══════════ */
.coach-wrap{display:flex;flex-direction:column;height:calc(100vh - 175px)}
.coach-msgs{flex:1;overflow-y:auto;padding:4px 0;margin-bottom:10px}
.msg{margin-bottom:11px}
.msg-role{font-family:var(--mono);font-size:8px;color:var(--muted2);letter-spacing:1px;margin-bottom:3px;text-transform:uppercase}
.msg-body{font-size:13px;line-height:1.65;background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
.msg.user .msg-body{background:rgba(255,45,85,.07);border-color:rgba(255,45,85,.2)}
.coach-row{display:flex;gap:7px}
.coach-in{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:11px;color:var(--text);font-size:13px;padding:10px 12px;outline:none;resize:none;line-height:1.5}
.coach-in:focus{border-color:var(--muted2)}
.btn-send{width:42px;height:42px;border-radius:11px;background:var(--red);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:opacity .2s}
.btn-send:active{opacity:.8}
.coach-typing{display:none;align-items:center;gap:6px;padding:10px 13px;background:var(--bg3);border:1px solid var(--border);border-radius:11px;margin-bottom:10px}
.coach-typing.on{display:flex}
.dot{width:5px;height:5px;border-radius:50%;background:var(--muted2);animation:blink 1.1s infinite}
.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ═══════════ MODAL ═══════════ */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;backdrop-filter:blur(6px)}
.overlay.on{display:block}
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg3);border-radius:18px 18px 0 0;z-index:201;padding:20px 18px 44px;max-height:82vh;overflow-y:auto;border-top:1px solid var(--border2)}
.sheet-handle{width:30px;height:3px;background:var(--border2);border-radius:100px;margin:0 auto 18px}
.sheet-title{font-size:17px;font-weight:800;margin-bottom:16px}
.sheet-field{margin-bottom:12px}
.sheet-field label{font-family:var(--mono);font-size:8px;color:var(--muted2);letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:5px}
.sheet-field input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:7px;padding:10px 11px;font-family:var(--mono);font-size:14px;color:var(--text);outline:none}
.sheet-field input:focus{border-color:var(--border2)}
.no-data{text-align:center;padding:50px 20px;color:var(--muted2)}
.no-data-icon{font-size:32px;margin-bottom:10px}
.no-data-ttl{font-size:14px;font-weight:700;margin-bottom:5px}
.no-data-sub{font-size:12px}
</style>
</head>
<body>

<nav>
  <div class="nav-top">
    <div class="logo">WELLNESS<em>OS</em></div>
    <button class="btn-settings" onclick="openSettings()">⚙</button>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="goPanel('entreno',this)">🏋️ Entreno</button>
    <button class="tab" onclick="goPanel('recovery',this)">💓 Recovery</button>
    <button class="tab" onclick="goPanel('progreso',this)">📈 Progreso</button>
    <button class="tab" onclick="goPanel('coach',this)">🤖 Coach</button>
  </div>
</nav>

<div id="drive-bar">
  <div class="sync-dot" id="sync-dot"></div>
  <div id="drive-status">Sin conexión a Drive</div>
  <button class="drive-btn" id="btn-drive-login" onclick="driveLogin()">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Conectar Drive
  </button>
</div>

<div id="p-entreno" class="panel active"></div>
<div id="p-recovery" class="panel"></div>
<div id="p-progreso" class="panel"></div>
<div id="p-coach" class="panel"></div>

<div class="overlay" id="ov-settings" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-title">Perfil y configuración</div>
    <div class="sheet-field"><label>Nombre</label><input id="s-name" type="text" placeholder="Javi"></div>
    <div class="sheet-field"><label>Edad</label><input id="s-age" type="number" placeholder="51"></div>
    <div class="sheet-field"><label>Peso objetivo (kg)</label><input id="s-goalw" type="number" placeholder="85"></div>
    <div class="sheet-field"><label>Proteína objetivo (g/día)</label><input id="s-prot" type="number" placeholder="175"></div>
    <div class="sheet-field"><label>FC Umbral Lactato (bpm)</label><input id="s-lt" type="number" placeholder="155"></div>
    <div class="sheet-field"><label>FC Máxima (bpm)</label><input id="s-hrmax" type="number" placeholder="176"></div>
    <div class="sheet-field"><label>Worker URL (Coach IA)</label><input id="s-worker" type="text" placeholder="https://tu-worker.workers.dev"></div>
    <button class="btn btn-primary btn-full" onclick="saveSettings()" style="margin-top:6px">Guardar</button>
  </div>
</div>

<script>
'use strict';

// ══════════════════════════════════════════
// CONSTANTS & STATE
// ══════════════════════════════════════════
var APP_VER = '3.0';
var DATA_KEY = 'wos_data_v3';
var HIST_KEY = 'wos_hist_v3';
var PROF_KEY = 'wos_prof_v3';

var DEFAULT_PROF = {
  name:'Javi', age:51, goalWeight:85, proteinGoal:175,
  ltHR:155, maxHR:176, workerUrl:''
};

var DEFAULT_PLAN = {
  'Torso A': {
    label:'TORSO A', sub:'Push/Pull Horizontal · Lunes', color:'#40c8e0', cardio:false,
    blocks:[
      {id:'A',ss:true,rest:90,exercises:[
        {id:'A1',name:'Press Inclinado Mancuernas',sets:3,repsLabel:'10-12'},
        {id:'A2',name:'Dominadas Pronas',sets:3,repsLabel:'RIR 2'}
      ]},
      {id:'B',ss:true,rest:90,exercises:[
        {id:'B1',name:'Remo Barra Supino',sets:3,repsLabel:'8-10'},
        {id:'B2',name:'Elevaciones Laterales',sets:3,repsLabel:'15-20'}
      ]},
      {id:'C',ss:true,rest:90,exercises:[
        {id:'C1',name:'Face Pulls',sets:3,repsLabel:'15'},
        {id:'C2',name:'Paseo del Granjero',sets:3,repsLabel:'45s'}
      ]}
    ]
  },
  'Cardio Z2': {

function loadData() { try { return JSON.parse(localStorage.getItem(DATA_KEY) || '{}'); } catch(e) { return {}; } }
function saveData(d) { localStorage.setItem(DATA_KEY, JSON.stringify(d)); scheduleDriveSync(); }
function loadProf() { try { return Object.assign({}, DEFAULT_PROF, JSON.parse(localStorage.getItem(PROF_KEY) || '{}')); } catch(e) { return Object.assign({}, DEFAULT_PROF); } }
function saveProf(p) { localStorage.setItem(PROF_KEY, JSON.stringify(p)); scheduleDriveSync(); }
function loadHist() { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch(e) { return []; } }
function saveHist(h) { localStorage.setItem(HIST_KEY, JSON.stringify(h)); scheduleDriveSync(); }

function todayStr() { return new Date().toISOString().slice(0,10); }

function getWeekStart(off) {
  var d = new Date();
  var day = d.getDay();
  var diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff + off * 7);
  d.setHours(0,0,0,0);
  return d;
}

function getWeekKey(off) {
  var d = getWeekStart(off);
  var yr = d.getFullYear();
  var jan1 = new Date(yr, 0, 1);
  var wk = Math.ceil((((d - jan1) / 86400000) + jan1.getDay() + 1) / 7);
  return yr + '-W' + String(wk).padStart(2,'0');
}

function getWeekLabel(off) {
  var s = getWeekStart(off);
  var e = new Date(s); e.setDate(e.getDate() + 6);
  var fmt = function(dt) { return dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'}); };
  return fmt(s) + ' – ' + fmt(e);
}

function loadWeekEntry(wk) {
  return loadHist().find(function(e) { return e.weekKey === wk; }) || null;
}

function saveWeekEntry(entry) {
  var h = loadHist();
  var idx = h.findIndex(function(e) { return e.weekKey === entry.weekKey; });
  if (idx >= 0) h[idx] = entry; else h.push(entry);
  h.sort(function(a,b) { return a.weekKey < b.weekKey ? -1 : 1; });
  saveHist(h);
}

// SCORES
// ══════════════════════════════════════════
function norm(v, lo, hi) {
  if (v == null || v === '' || isNaN(v)) return null;
  return Math.max(0, Math.min(100, ((v - lo) / (hi - lo)) * 100));
}

function calcRecovery(w) {
  var hrv  = norm(w.hrv, 20, 80);
  var bb   = (w.bodyBattery != null && w.bodyBattery !== '') ? Math.max(0,Math.min(100,parseFloat(w.bodyBattery))) : null;
  var fcr  = (w.fcReposo != null && w.fcReposo !== '') ? Math.max(0,Math.min(100,((80 - parseFloat(w.fcReposo)) / 40) * 100)) : null;
  var en   = (w.energia != null && w.energia !== '') ? (parseFloat(w.energia) - 1) / 9 * 100 : null;
  var parts = [[hrv,0.35],[bb,0.30],[fcr,0.20],[en,0.15]];
  var valid = parts.filter(function(c) { return c[0] != null; });
  if (!valid.length) return null;
  var tw = valid.reduce(function(s,c) { return s+c[1]; }, 0);
  return Math.round(valid.reduce(function(s,c) { return s+c[0]*c[1]; }, 0) / tw);
}

function calcRecomp(w, recovery, hist) {
  var prof = loadProf();
  var prot = (w.proteina != null && w.proteina !== '') ? Math.min(100, (parseFloat(w.proteina) / prof.proteinGoal) * 100) : null;
  var pes = null;
  if (w.peso != null && w.peso !== '' && hist.length > 0) {
    var prev = hist[hist.length-1];
    if (prev.wellness && prev.wellness.peso != null) {
      var diff = parseFloat(w.peso) - parseFloat(prev.wellness.peso);
      if (diff <= -0.5) pes = 100;
      else if (diff < 0) pes = 60 + (-diff / 0.5) * 40;
      else if (diff === 0) pes = 60;
      else pes = Math.max(0, 60 - diff * 30);
    }
  }
  var parts = [[prot,0.40],[recovery,0.35],[pes,0.25]];
  var valid = parts.filter(function(c) { return c[0] != null; });
  if (!valid.length) return null;
  var tw = valid.reduce(function(s,c) { return s+c[1]; }, 0);
  return Math.round(valid.reduce(function(s,c) { return s+c[0]*c[1]; }, 0) / tw);
}

function calcLongevity(w, hist) {
  var vo2  = norm(w.vo2max, 25, 55);
  var hrvc = null;
  var rec4 = hist.slice(-4).filter(function(e) { return e.wellness && e.wellness.hrv != null; });
  if (rec4.length) hrvc = norm(rec4.reduce(function(s,e) { return s+parseFloat(e.wellness.hrv); }, 0) / rec4.length, 20, 80);
  var fcr = (w.fcReposo != null && w.fcReposo !== '') ? Math.max(0,Math.min(100,((80-parseFloat(w.fcReposo))/40)*100)) : null;
  var sed = (w.sedentario != null && w.sedentario !== '') ? Math.max(0,Math.min(100,(1-parseFloat(w.sedentario)/10)*100)) : null;
  var parts = [[vo2,0.35],[hrvc,0.25],[fcr,0.25],[sed,0.15]];
  var valid = parts.filter(function(c) { return c[0] != null; });
  if (!valid.length) return null;
  var tw = valid.reduce(function(s,c) { return s+c[1]; }, 0);
  return Math.round(valid.reduce(function(s,c) { return s+c[0]*c[1]; }, 0) / tw);
}

// ── Strength ──────────────────────────────
function buildStrengthDayHtml(dayKey, day, color) {
  var d = loadData();
  var total = 0, done = 0;
  day.blocks.forEach(function(b) {
    b.exercises.forEach(function(ex) {
      for (var i=0;i<ex.sets;i++) {
        total++;
        var k = dayKey+'_'+ex.id+'_'+i+'_'+activeDate;
        if (d[k] && d[k].done) done++;
      }
    });
  });
  var pct = total > 0 ? Math.round((done/total)*100) : 0;

  var html = '';
  html += '<div class="prog-wrap">';
  html += '<div class="prog-top"><span class="prog-lbl">Progreso hoy</span>';
  html += '<span class="prog-val" style="color:'+color+'">'+done+' / '+total+' series</span></div>';
  html += '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%;background:'+color+'"></div></div>';
  html += '</div>';
  html += '<div id="rest-bar" class="rest-bar">';
  html += '<div class="rb-info"><div class="rb-lbl">Descanso</div>';
  html += '<div class="rb-val" id="rb-val">—</div>';
  html += '<div class="rb-track"><div class="rb-fill" id="rb-fill" style="width:100%;background:'+color+'"></div></div>';
  html += '</div><button class="btn-skip" onclick="stopRest()">Saltar ›</button></div>';

  day.blocks.forEach(function(b) { html += buildBlockHtml(b, dayKey, color, d); });

  var noteKey = 'note_'+dayKey+'_'+activeDate;
  var savedNote = d[noteKey] || '';
  html += '<div class="sh"><div class="sh-title">Notas de sesión</div><div class="sh-line"></div></div>';
  html += '<textarea class="notes-ta" rows="3" placeholder="Sensaciones, cargas, observaciones…" onchange="saveNote(\''+dayKey+'\',this.value)">'+savedNote+'</textarea>';
  return html;
}

function saveNote(dk, val) {
  var d = loadData();
  d['note_'+dk+'_'+activeDate] = val;
  saveData(d);
}

function buildBlockHtml(block, dayKey, color, d) {
  var html = '<div class="block-wrap">';
  html += '<div class="block-hdr">';
  if (block.ss) {
    html += '<span class="ss-badge">SS · Bloque '+block.id+' · '+block.rest+'s</span>';
  } else {
    html += '<span class="block-solo-lbl">Bloque '+block.id+' · '+block.rest+'s descanso</span>';
  }
  html += '</div>';
  html += '<div class="block-exs" style="border-color:'+color+'35">';
  block.exercises.forEach(function(ex) { html += buildExHtml(ex, block, dayKey, color, d); });
  html += '</div></div>';
  return html;
}

function buildExHtml(ex, block, dayKey, color, d) {
  var allDone = true;
  for (var i=0;i<ex.sets;i++) {
    if (!d[dayKey+'_'+ex.id+'_'+i+'_'+todayStr()] || !d[dayKey+'_'+ex.id+'_'+i+'_'+todayStr()].done) { allDone=false; break; }
  }
  var nameColor = allDone ? 'var(--muted2)' : color;
  var html = '<div class="ex-card">';
  html += '<div class="ex-name" style="color:'+nameColor+'">'+ex.name+'</div>';
  html += '<div class="ex-meta">Objetivo: <b>'+ex.repsLabel+'</b></div>';
  html += '<div class="col-hdrs"><div class="col-hdr">Set</div><div class="col-hdr">Peso kg</div><div></div><div class="col-hdr">Reps</div><div class="col-hdr">✓</div></div>';
  for (var i=0;i<ex.sets;i++) {
    var key = dayKey+'_'+ex.id+'_'+i+'_'+todayStr();
    var sd = d[key] || {w:'',r:'',done:false};
    html += buildSetRowHtml(key, i, sd, color, block.rest);
  }
  html += '</div>';
  return html;
}

function buildSetRowHtml(key, idx, sd, color, restSecs) {
  var done = sd.done || false;
  var cls = done ? 'set-row done' : 'set-row';
  var chkBg = done ? 'rgba(255,255,255,0.05)' : color;
  var chkColor = done ? 'var(--muted2)' : '#000';
  var chkIcon = done ? '✓' : '·';
  var safe = key.replace(/[^a-zA-Z0-9]/g,'_');
  return '<div class="'+cls+'" id="sr_'+safe+'">'+
    '<div class="set-num">'+(idx+1)+'</div>'+
    '<input class="set-in" type="number" placeholder="—" value="'+(sd.w||'')+'" '+
    (done?'disabled ':'')+
    'oninput="setField(\''+key+'\',\'w\',this.value)">'+
    '<div class="set-sep">×</div>'+
    '<input class="set-in" type="number" placeholder="—" value="'+(sd.r||'')+'" '+
    (done?'disabled ':'')+
    'oninput="setField(\''+key+'\',\'r\',this.value)">'+
    '<button class="btn-chk" style="background:'+chkBg+';color:'+chkColor+'" '+
    'onclick="toggleSet(\''+key+'\','+restSecs+')">'+chkIcon+'</button>'+
    '</div>';

function setField(key, field, val) {
  var d = loadData();
  if (!d[key]) d[key] = {w:'',r:'',done:false};
  d[key][field] = val;
  saveData(d);
}

function toggleSet(key, restSecs) {
  var d = loadData();
  if (!d[key]) d[key] = {w:'',r:'',done:false};
  d[key].done = !d[key].done;
  var wasDone = d[key].done;
  saveData(d);
  renderEntreno();
  if (wasDone) startRest(restSecs);
}

// ── Rest timer ─────────────────────────────
function startRest(secs) {
  stopRest();
  restEnd = Date.now() + secs * 1000;
  restTotal = secs;
  var el = document.getElementById('rest-bar');
  if (el) el.classList.add('on');
  restTimer = setInterval(tickRest, 300);
  tickRest();
}

function stopRest() {
  if (restTimer) { clearInterval(restTimer); restTimer = null; }
  restEnd = null; restTotal = null;
  var el = document.getElementById('rest-bar');
  if (el) el.classList.remove('on');
}

function tickRest() {
  if (!restEnd) return;
  var rem = Math.max(0, Math.ceil((restEnd - Date.now()) / 1000));
  var vEl = document.getElementById('rb-val');
  var fEl = document.getElementById('rb-fill');
  if (vEl) vEl.textContent = Math.floor(rem/60)+':'+String(rem%60).padStart(2,'0');
  if (fEl) fEl.style.width = (restTotal > 0 ? (rem/restTotal)*100 : 0)+'%';
  if (rem <= 0) { stopRest(); toast('¡A por la siguiente serie!','#00e5a0'); }
}

// ══════════════════════════════════════════
// GARMIN CSV IMPORT
// ══════════════════════════════════════════

// Fuzzy column finder — returns index or -1
function findCol(headers, candidates) {
  for (var i = 0; i < headers.length; i++) {
    var h = headers[i].toLowerCase().replace(/['"()]/g,'').trim();
    for (var j = 0; j < candidates.length; j++) {
      if (h.indexOf(candidates[j]) !== -1) return i;
    }
  }
  return -1;
}

function parseGarminCSV(text) {
  // Remove BOM
  text = text.replace(/^\uFEFF/, '').trim();
  var lines = text.split(/\r?\n/).filter(function(l) { return l.trim(); });
  if (lines.length < 2) return null;

  // Detect delimiter: count commas vs semicolons in header
  var h0 = lines[0];
  var delim = (h0.match(/;/g)||[]).length > (h0.match(/,/g)||[]).length ? ';' : ',';

  // Parse headers
  var headers = h0.split(delim).map(function(h) { return h.replace(/^"|"$/g,'').trim(); });

  // Map columns — lists ordered by priority
  var colHRV    = findCol(headers, ['hrv last night avg','nightly hrv average','hrv avg','hrv last night','hrv (last','hrv']);
  var colBB     = findCol(headers, ['avg body battery','average body battery','body battery high','body battery']);
  var colFC     = findCol(headers, ['resting heart rate','resting hr','fc reposo','frecuencia cardiaca reposo','hr reposo']);
  var colStress = findCol(headers, ['avg stress','average stress','stress average','stress avg','estres medio','stress']);
  var colDate   = findCol(headers, ['date','fecha','day','date local']);

  // Get week window
  var wkStart = getWeekStart(weekOffset);
  var wkEnd   = new Date(wkStart); wkEnd.setDate(wkEnd.getDate() + 7);

  var buckets = { hrv: [], bodyBattery: [], fcReposo: [], stress: [] };
  var totalRows = 0;
  var matchedRows = 0;

  lines.slice(1).forEach(function(line) {
    if (!line.trim()) return;
    totalRows++;
    // Split respecting quoted fields
    var cells = [];
    var inQ = false, cur = '';
    for (var ci = 0; ci < line.length; ci++) {
      var ch = line[ci];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === delim && !inQ) { cells.push(cur.trim()); cur = ''; }
      else { cur += ch; }
    }
    cells.push(cur.trim());

    // Parse date
    if (colDate >= 0) {
      var ds = cells[colDate] ? cells[colDate].replace(/^"|"$/g,'').trim() : '';
      if (ds) {
        var d = new Date(ds);
        // Try alternate date format dd/mm/yyyy if needed
        if (isNaN(d.getTime()) && ds.match(/^\d{2}\/\d{2}\/\d{4}$/)) {
          var parts = ds.split('/');
          d = new Date(parts[2]+'-'+parts[1]+'-'+parts[0]);
        }
        if (isNaN(d.getTime()) || d < wkStart || d >= wkEnd) return;
      }
    }
    matchedRows++;

    function getNum(idx) {
      if (idx < 0 || idx >= cells.length) return null;
      var v = parseFloat(cells[idx]);
      return isNaN(v) ? null : v;
    }

    var hrv  = getNum(colHRV);
    var bb   = getNum(colBB);
    var fcr  = getNum(colFC);
    var str  = getNum(colStress);

    if (hrv  != null && hrv > 0)   buckets.hrv.push(hrv);
    if (bb   != null && bb > 0)    buckets.bodyBattery.push(bb);
    if (fcr  != null && fcr > 0)   buckets.fcReposo.push(fcr);
    if (str  != null && str >= 0)  buckets.stress.push(str);
  });

  function avg(arr) {
    if (!arr.length) return null;
    return Math.round(arr.reduce(function(a,b){return a+b;},0) / arr.length * 10) / 10;
  }

  return {
    hrv: avg(buckets.hrv),
    bodyBattery: avg(buckets.bodyBattery),
    fcReposo: avg(buckets.fcReposo),
    stress: avg(buckets.stress),
    detectedCols: {
      hrv: colHRV >= 0, bodyBattery: colBB >= 0,
      fcReposo: colFC >= 0, stress: colStress >= 0
    },
    totalRows: totalRows,
    matchedRows: matchedRows
  };
}

function importGarminCSV(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var result = parseGarminCSV(ev.target.result);
      input.value = '';
      if (!result) { toast('CSV vacío o no reconocido', '#ff2d55'); return; }

      var resEl = document.getElementById('csv-result');
      if (!result.matchedRows && !result.totalRows) {
        if (resEl) resEl.innerHTML = '<div style="background:rgba(255,45,85,0.07);border:1px solid rgba(255,45,85,.25);border-radius:8px;padding:10px 12px;font-size:12px;color:rgba(255,45,85,.85);margin-bottom:10px">No se encontraron filas para esta semana. Prueba exportando un rango de fechas que incluya ' + getWeekLabel(weekOffset) + '.</div>';
        return;
      }

      // Apply found values to form fields
      var applied = [];
      if (result.hrv != null) { var el=document.getElementById('r-hrv'); if(el){el.value=result.hrv;} applied.push('HRV: '+result.hrv+' ms'); }
      if (result.bodyBattery != null) { var el=document.getElementById('r-bb'); if(el){el.value=result.bodyBattery;} applied.push('Body Battery: '+result.bodyBattery); }
      if (result.fcReposo != null) { var el=document.getElementById('r-fcr'); if(el){el.value=result.fcReposo;} applied.push('FC Reposo: '+result.fcReposo+' bpm'); }

      // Show result summary
      var rows = result.matchedRows > 0 ? result.matchedRows : result.totalRows;
      var msg = applied.length > 0
        ? '<div style="background:rgba(0,229,160,0.07);border:1px solid rgba(0,229,160,.25);border-radius:8px;padding:10px 12px;margin-bottom:10px">' +
          '<div style="font-size:10px;font-family:var(--mono);color:#00e5a0;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px">CSV importado · '+rows+' días</div>' +
          '<div style="font-size:12px;color:rgba(235,235,240,.75);line-height:1.6">'+applied.join(' · ')+'</div>' +
          (result.stress != null ? '<div style="font-size:11px;color:var(--muted2);margin-top:3px">Estrés medio detectado: '+result.stress+' (informativo)</div>' : '') +
          '</div>'
        : '<div style="background:rgba(255,159,10,0.07);border:1px solid rgba(255,159,10,.25);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12px;color:rgba(255,159,10,.85)">CSV leído ('+rows+' filas) pero no se reconocieron columnas de HRV, Body Battery ni FC. Comprueba que es el export de Health Stats de Garmin Connect.</div>';

      if (resEl) resEl.innerHTML = msg;

    } catch(err) {
      toast('Error al procesar el CSV', '#ff2d55');
      console.error(err);
    }
  };
  reader.readAsText(file, 'UTF-8');
}

function exportJSON() {
  var obj = {
    version: APP_VER,
    exportDate: new Date().toISOString(),
    profile: loadProf(),
    history: loadHist(),
    trainingData: loadData()
  };
  var blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'WellnessOS_' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Historial exportado ✓', '#00e5a0');
}

function importJSON(input) {
  var file = input.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      if (data.history && Array.isArray(data.history)) {
        var merged = loadHist();
        data.history.forEach(function(entry) {
          var idx = merged.findIndex(function(e){return e.weekKey===entry.weekKey;});
          if (idx>=0) merged[idx]=entry; else merged.push(entry);
        });
        merged.sort(function(a,b){return a.weekKey<b.weekKey?-1:1;});
        saveHist(merged);
      }
      if (data.trainingData) saveData(Object.assign(loadData(), data.trainingData));
      if (data.profile) saveProf(Object.assign(loadProf(), data.profile));
      input.value = '';
      toast('Importado correctamente ✓', '#00e5a0');
      renderProgreso();
    } catch(err) {
      toast('Error al leer el archivo', '#ff2d55');
    }
  };
  reader.readAsText(file);
}

  ctx += 'Plan semanal: Torso A (Lun), Cardio Z2 trail (Mar), Pierna (Mié), Torso B (Vie), Intervalos cuesta (Sáb). ';
  if (last) {
    ctx += 'Última semana ('+( last.weekLabel||last.weekKey)+'): ';
    ctx += 'Recovery '+( last.scores.recovery||'—')+', Recomp '+(last.scores.recomp||'—')+', Longevity '+(last.scores.longevity||'—')+'. ';
    if (last.wellness) {
      var w = last.wellness;
      if (w.peso) ctx += 'Peso actual: '+w.peso+' kg. ';
      if (w.hrv) ctx += 'HRV: '+w.hrv+' ms. ';
      if (w.vo2max) ctx += 'VO2max: '+w.vo2max+'. ';
    }
  }
  ctx += 'Responde en español. Sé preciso y basado en evidencia. Sin inventar datos. Máximo 3 párrafos cortos.';
  return ctx;
}

async function sendCoach() {
  var input = document.getElementById('cin');
  var text = input ? input.value.trim() : '';
  if (!text) return;
  var p = loadProf();
  var url = p.workerUrl || 'https://api.anthropic.com/v1/messages';
  coachMsgs.push({role:'user',content:text});
  input.value = '';
  renderCoach();
  var typ = document.getElementById('ctyp');
  if (typ) typ.classList.add('on');
  try {
    var msgs = coachMsgs.slice(-10).map(function(m){return {role:m.role,content:m.content};});
    var resp = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,system:buildSysPrompt(),messages:msgs})
    });
    if (!resp.ok) throw new Error('HTTP '+resp.status);
    var data = await resp.json();
    var reply = data.content && data.content[0] ? data.content[0].text : 'Sin respuesta.';
    coachMsgs.push({role:'assistant',content:reply});
  } catch(err) {
    coachMsgs.push({role:'assistant',content:'Error de conexión. Verifica la Worker URL en ⚙ Configuración.'});
  }
  renderCoach();
}

var DRIVE_CLIENT_ID = '601691093802-k475gd25ejmt6qippldvam0fc3ed0jhv.apps.googleusercontent.com';
var DRIVE_SCOPE     = 'https://www.googleapis.com/auth/drive.file';
var DRIVE_FILE_NAME = 'wellnessos-data.json';

var driveToken    = null;
var driveFileId   = null;
var driveEmail    = null;
var driveSyncTmt  = null;

function setDriveStatus(state, msg) {
  var dot = document.getElementById('sync-dot');
  var lbl = document.getElementById('drive-status');
  if (dot) dot.className = 'sync-dot' + (state ? ' '+state : '');
  if (lbl) { lbl.textContent = msg; lbl.className = state || ''; }
}

function driveLogin() {
  if (typeof google === 'undefined' || !google.accounts) {
    setDriveStatus('err','Cargando Google…'); setTimeout(driveLogin, 1500); return;
  }
  var client = google.accounts.oauth2.initTokenClient({
    client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE,
    callback: function(resp) {
      if (resp.error) { setDriveStatus('err','Error de autenticación'); return; }
      driveToken = resp.access_token;
      fetch('https://www.googleapis.com/oauth2/v3/userinfo', {headers:{Authorization:'Bearer '+driveToken}})
        .then(function(r){return r.json();}).then(function(u){driveEmail=u.email||'';}).catch(function(){});
      showDriveConnected();
      setDriveStatus('syncing','Conectando…');
      driveLoadOrCreate();
    }
  });
  client.requestAccessToken();
}

function driveLogout() {
  if (driveToken) google.accounts.oauth2.revoke(driveToken);
  driveToken = null; driveFileId = null; driveEmail = null;
  setDriveStatus('','Sin conexión a Drive');
  var login = document.getElementById('btn-drive-login');
  var logout = document.getElementById('btn-drive-logout');
  if (login) login.style.display = 'flex';
  if (logout) logout.remove();
}

function showDriveConnected() {
  var login = document.getElementById('btn-drive-login');
  if (login) login.style.display = 'none';
  if (!document.getElementById('btn-drive-logout')) {
    var btn = document.createElement('button');
    btn.id = 'btn-drive-logout'; btn.className = 'drive-btn';
    btn.style.cssText = 'background:rgba(255,255,255,.04);border-color:var(--border);color:var(--muted2)';
    btn.textContent = 'Desconectar'; btn.onclick = driveLogout;
    document.getElementById('drive-bar').appendChild(btn);
  }
}

function buildDrivePayload() {
  return JSON.stringify({
    version: APP_VER,
    savedAt: new Date().toISOString(),
    data:    loadData(),
    hist:    loadHist(),
    prof:    loadProf()
  });
}

async function driveLoadOrCreate() {
  try {
    var q = encodeURIComponent("name='"+DRIVE_FILE_NAME+"' and trashed=false");
    var res = await fetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,modifiedTime)', {
      headers:{Authorization:'Bearer '+driveToken}
    });
    var json = await res.json();
    if (json.files && json.files.length > 0) {
      driveFileId = json.files[0].id;
      await drivePullAndMerge();
    } else {
      await driveCreateFile();
      setDriveStatus('ok', driveEmail ? '✓ '+driveEmail : '✓ Drive conectado');
    }
  } catch(e) { setDriveStatus('err','Error al conectar'); }
}

async function driveCreateFile() {
  var form = new FormData();
  form.append('metadata', new Blob([JSON.stringify({name:DRIVE_FILE_NAME,mimeType:'application/json'})],{type:'application/json'}));
  form.append('file', new Blob([buildDrivePayload()],{type:'application/json'}));
  var res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{
    method:'POST', headers:{Authorization:'Bearer '+driveToken}, body:form
  });
  var d = await res.json(); driveFileId = d.id;
}

async function drivePullAndMerge() {
  setDriveStatus('syncing','Sincronizando…');
  try {
    var res = await fetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media',{
      headers:{Authorization:'Bearer '+driveToken}
    });
    var remote = await res.json();

    // Merge data: union of keys, prefer newer by key presence
    var localData = loadData();
    var merged = Object.assign({}, remote.data || {});
    Object.keys(localData).forEach(function(k){ if (!(k in merged)) merged[k] = localData[k]; });
    localStorage.setItem(DATA_KEY, JSON.stringify(merged));

    // Merge hist: deduplicate by weekKey
    var localHist = loadHist();
    var remoteHist = remote.hist || [];
    var histMap = {};
    remoteHist.forEach(function(e){ histMap[e.weekKey] = e; });
    localHist.forEach(function(e){ if (!(e.weekKey in histMap)) histMap[e.weekKey] = e; });
    var mergedHist = Object.values(histMap).sort(function(a,b){return a.weekKey<b.weekKey?-1:1;});
    localStorage.setItem(HIST_KEY, JSON.stringify(mergedHist));

    // Prof: prefer local if set, else remote
    if (remote.prof && !localStorage.getItem(PROF_KEY)) {
      localStorage.setItem(PROF_KEY, JSON.stringify(remote.prof));
    }

    await drivePush();
    setDriveStatus('ok', driveEmail ? '✓ '+driveEmail : '✓ Sincronizado');

    // Re-render active panel
    var active = document.querySelector('.panel.active');
    if (active) {
      var id = active.id.replace('p-','');
      if (id === 'entreno') renderEntreno();
      else if (id === 'recovery') renderRecovery();
      else if (id === 'progreso') renderProgreso();
    }
  } catch(e) { setDriveStatus('err','Error al sincronizar'); }
}

async function drivePush() {
  if (!driveToken || !driveFileId) return;
  try {
    await fetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',{
      method:'PATCH',
      headers:{Authorization:'Bearer '+driveToken,'Content-Type':'application/json'},
      body: buildDrivePayload()
    });
  } catch(e) { console.warn('Drive push error:', e); }
}

function scheduleDriveSync() {
  if (!driveToken || !driveFileId) return;
  clearTimeout(driveSyncTmt);
  setDriveStatus('syncing','Guardando…');
  driveSyncTmt = setTimeout(async function() {
    await drivePush();
    setDriveStatus('ok', driveEmail ? '✓ '+driveEmail : '✓ Guardado en Drive');
  }, 1500);
}

function trySilentAuth() {
  try {
    if (typeof google === 'undefined' || !google.accounts) { setTimeout(trySilentAuth, 500); return; }
    var client = google.accounts.oauth2.initTokenClient({
      client_id: DRIVE_CLIENT_ID, scope: DRIVE_SCOPE, prompt: '',
      callback: function(resp) {
        if (resp && !resp.error) {
          driveToken = resp.access_token;
          fetch('https://www.googleapis.com/oauth2/v3/userinfo',{headers:{Authorization:'Bearer '+driveToken}})
            .then(function(r){return r.json();}).then(function(u){driveEmail=u.email||'';}).catch(function(){});
          showDriveConnected();
          setDriveStatus('syncing','Reconectando…');
          driveLoadOrCreate();
        }
      }
    });
    client.requestAccessToken({prompt:''});
  } catch(e) {}
}
